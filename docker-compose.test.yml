version: '3.8'

# Integration test infrastructure
# PostgreSQL provided by Neon (cloud) - only Redis runs locally

services:
  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # Different port to avoid conflicts with dev Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis-test-data:/data

volumes:
  redis-test-data:
