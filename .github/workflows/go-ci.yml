name: Go CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install sqlc
      run: |
        curl -L https://github.com/sqlc-dev/sqlc/releases/download/v1.30.0/sqlc_1.30.0_linux_amd64.tar.gz -o sqlc.tar.gz
        tar -xzf sqlc.tar.gz
        sudo mv sqlc /usr/local/bin/
        sqlc version

    - name: Run CI checks
      run: make ci

    - name: Build
      run: go build -v ./...
