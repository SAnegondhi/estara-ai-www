name: Integration Tests

on:
  push:
    branches: [ master, main, adr-083-store-migration ]
  pull_request:
    branches: [ master, main ]

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install sqlc
        run: |
          curl -L https://github.com/sqlc-dev/sqlc/releases/download/v1.30.0/sqlc_1.30.0_linux_amd64.tar.gz -o sqlc.tar.gz
          tar -xzf sqlc.tar.gz
          sudo mv sqlc /usr/local/bin/
          sqlc version

      - name: Create test databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5433 -U postgres -c "CREATE DATABASE estara_test;"
          psql -h localhost -p 5433 -U postgres -c "CREATE DATABASE estara_market_test;"
          psql -h localhost -p 5433 -U postgres -c "SELECT datname FROM pg_database WHERE datname LIKE '%test%';"

      - name: Run sqlc generate
        run: sqlc generate

      - name: Build
        run: go build ./...

      # Note: Add migration step here if you have a migrate command
      # - name: Run migrations
      #   env:
      #     DATABASE_URL: postgresql://postgres:postgres@localhost:5433/estara_test?sslmode=disable
      #   run: go run cmd/server/main.go migrate

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/estara_test?sslmode=disable
          MARKET_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/estara_market_test?sslmode=disable
          REDIS_URL: redis://localhost:6380/1
          REDIS_CACHE_URL: redis://localhost:6380/1
          CLIENT_JWT_SECRET: test-jwt-secret-for-ci-integration-tests-32chars
          AUTH_SECRET: test-auth-secret-for-ci-integration-tests-32chars
          AUTH_TRUST_HOST: true
          NEXT_PUBLIC_WWW_URL: http://localhost:3000
          NEXT_PUBLIC_CLIENT_URL: http://localhost:3002
          CLIENT_URL: http://localhost:3002
          MARKETING_URL: http://localhost:3500
        run: |
          # Write env vars to .env.test so make test-integration can source it
          cat > .env.test <<EOF
          DATABASE_URL=${DATABASE_URL}
          MARKET_DATABASE_URL=${MARKET_DATABASE_URL}
          REDIS_URL=${REDIS_URL}
          REDIS_CACHE_URL=${REDIS_CACHE_URL}
          CLIENT_JWT_SECRET=${CLIENT_JWT_SECRET}
          AUTH_SECRET=${AUTH_SECRET}
          AUTH_TRUST_HOST=${AUTH_TRUST_HOST}
          NEXT_PUBLIC_WWW_URL=${NEXT_PUBLIC_WWW_URL}
          NEXT_PUBLIC_CLIENT_URL=${NEXT_PUBLIC_CLIENT_URL}
          CLIENT_URL=${CLIENT_URL}
          MARKETING_URL=${MARKETING_URL}
          EOF
          make test-integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage.out
            coverage.html
          retention-days: 30
