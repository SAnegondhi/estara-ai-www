version: "2"
sql:
  # Main application database queries
  - engine: "postgresql"
    queries: "internal/db/queries/sql/"
    schema: "internal/db/queries/schema/"
    gen:
      go:
        package: "queries"
        out: "internal/db/queries"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_exported_queries: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "json"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "UserRole"
            go_type: "string"

  # Market database queries (separate PostgreSQL for time series data)
  - engine: "postgresql"
    queries: "internal/db/marketqueries/sql/"
    schema: "internal/db/marketqueries/schema/"
    gen:
      go:
        package: "marketqueries"
        out: "internal/db/marketqueries"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_exported_queries: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "numeric"
            go_type: "float64"
