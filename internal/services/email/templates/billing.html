<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Headline}}</title>
</head>
<body style="font-family: 'DM Sans', Arial, sans-serif; line-height: 1.6; color: #374151; max-width: 600px; margin: 0 auto; padding: 20px; background: #f9fafb;">

  <div style="background: #111827; padding: 32px 30px; border-radius: 12px 12px 0 0; text-align: center;">
    <h1 style="color: white; margin: 0; font-size: 22px; font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; letter-spacing: -0.02em;">Estara AI</h1>
    <p style="color: rgba(255,255,255,0.45); margin: 8px 0 0 0; font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; font-family: 'DM Serif Display', Georgia, serif;">{{.Headline}}</p>
  </div>

  <div style="background: white; padding: 36px 30px; border-radius: 0 0 12px 12px; border: 1px solid #e5e7eb; border-top: none;">

    <h2 style="color: #111827; margin: 0 0 20px 0; font-size: 19px; font-family: 'DM Serif Display', Georgia, serif; font-weight: 400;">{{.FirstName}},</h2>

    <p style="margin-bottom: 20px; font-size: 14px; line-height: 1.65; color: #4b5563;">{{.Message}}</p>

    <p style="margin-bottom: 0; font-size: 12px; color: #6b7280;">
      If you have questions, reply to this email or contact support@estara-ai.com.
    </p>

    <div style="margin-top: 28px; text-align: center; border-top: 1px solid #e5e7eb; padding-top: 20px;">
      <p style="font-size: 12px; color: #9ca3af; margin: 0; line-height: 1.6;">
        Independent decision-support platform. Not investment advice. No deal promotion.
      </p>
      <p style="font-size: 12px; color: #9ca3af; margin: 8px 0 0 0;">
        &copy; {{.Year}} Estara AI. All rights reserved.
      </p>
    </div>
  </div>
</body>
</html>
